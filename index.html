<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStudents Admin Panel</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}header{background:#1565c0;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}button{border:0;border-radius:9px;padding:10px 13px;background:#1565c0;color:#fff;font-weight:700;cursor:pointer}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3df;border-radius:9px;margin:5px 0 10px}textarea{min-height:80px}.wrap{max-width:1100px;margin:18px auto;padding:0 12px}.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#e7edf7;color:#174a85}.tabs button.active{background:#0d47a1;color:#fff}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.hidden{display:none}.muted{color:#667085;font-size:14px}.danger{background:#c62828}.ok{background:#2e7d32}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7ebf0;font-size:14px}.pill{background:#e7edf7;border-radius:20px;padding:4px 8px;font-size:12px}.login{max-width:420px;margin:55px auto}#msg{margin-top:8px}.stat{font-size:26px;font-weight:800}</style></head><body>
<header><b>SmartStudents — Admin Panel</b><button id="logout" class="hidden">Logout</button></header><main class="wrap">
<section id="login" class="card login"><h2>Admin Login</h2><p class="muted">अपने Firebase Authentication वाले Admin account से login करें। Admin की Firestore users/{uid} entry में role = ADMIN होना चाहिए।</p><input id="email" type="email" placeholder="Admin Email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="msg" class="muted"></div></section>
<section id="app" class="hidden"><div class="tabs"><button data-t="dashboard">Dashboard</button><button data-t="courses">Courses</button><button data-t="chapters">Chapters</button><button data-t="lessons">Lessons</button><button data-t="quiz">Quiz</button><button data-t="notices">Notices</button></div><div id="view"></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
import {getFirestore,doc,getDoc,collection,getDocs,setDoc,deleteDoc,addDoc,query,orderBy,where} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const firebaseConfig={apiKey:"PASTE_FIREBASE_CONFIG",authDomain:"PASTE_FIREBASE_CONFIG",projectId:"PASTE_FIREBASE_CONFIG",storageBucket:"PASTE_FIREBASE_CONFIG",messagingSenderId:"PASTE_FIREBASE_CONFIG",appId:"PASTE_FIREBASE_CONFIG"};
let ready=false,db,auth;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(x){$('msg').textContent=x} function ok(){msg('')} function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');tab('dashboard') }
$('loginBtn').onclick=async()=>{try{if(!ready)throw Error('पहले Firebase config डालें।');const r=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value);const u=await getDoc(doc(db,'users',r.user.uid));if(!u.exists()||String(u.data().role||'').toUpperCase()!=='ADMIN'){await signOut(auth);throw Error('इस account को ADMIN permission नहीं है।');}showApp()}catch(e){msg(e.message||'Login failed')}};
$('logout').onclick=()=>signOut(auth); document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
async function init(){if(firebaseConfig.apiKey.startsWith('PASTE_')){msg('admin-panel/firebase-config.js या इस file में अपना Firebase config डालें।');return}const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);ready=true;onAuthStateChanged(auth,async u=>{if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}const x=await getDoc(doc(db,'users',u.uid));if(x.exists()&&String(x.data().role||'').toUpperCase()==='ADMIN')showApp();else signOut(auth)})}
async function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t)); if(t==='dashboard')return dashboard(); if(t==='courses')return courses(); if(t==='chapters')return chapters(); if(t==='lessons')return lessons(); if(t==='quiz')return quiz(); if(t==='notices')return notices()}
async function count(c){return (await getDocs(collection(db,c))).size}
async function dashboard(){let a=await Promise.all(['courses','announcements','users'].map(count));$('view').innerHTML=`<div class="card"><h2>Dashboard</h2><div class="grid"><div class="card"><span class="muted">Courses</span><div class="stat">${a[0]}</div></div><div class="card"><span class="muted">Announcements</span><div class="stat">${a[1]}</div></div><div class="card"><span class="muted">Users</span><div class="stat">${a[2]}</div></div></div></div>`}
async function courses(){const s=await getDocs(collection(db,'courses'));let rows='';s.forEach(d=>{let x=d.data();rows+=`<tr><td>${esc(d.id)}</td><td>${esc(x.className)}</td><td>${esc(x.subject)}</td><td>${esc(x.title)}</td><td>${x.published?'Published':'Draft'}</td><td><button class="danger" onclick="window.delCourse('${d.id}')">Delete</button></td></tr>`});$('view').innerHTML=`<div class="card"><h2>Course जोड़ें</h2><div class="row"><input id="cid" placeholder="Course ID"><input id="ctitle" placeholder="Title"><input id="cboard" placeholder="Board (CBSE/ICSE/UP Board)"><input id="cclass" placeholder="Class (LKG/1/12)"><input id="csubject" placeholder="Subject"></div><label><input id="cpub" type="checkbox"> Published</label><br><button onclick="window.saveCourse()">Save Course</button></div><div class="card"><h2>Courses</h2><table><tr><th>ID</th><th>Class</th><th>Subject</th><th>Title</th><th>Status</th><th></th></tr>${rows}</table></div>`}
window.saveCourse=async()=>{let id=$('cid').value.trim();if(!id)return alert('Course ID जरूरी है');await setDoc(doc(db,'courses',id),{id,title:$('ctitle').value.trim(),board:$('cboard').value.trim(),className:$('cclass').value.trim(),subject:$('csubject').value.trim(),published:$('cpub').checked},{merge:true});alert('Course save हो गया');courses()};window.delCourse=async id=>{if(confirm('Course delete करें?')){await deleteDoc(doc(db,'courses',id));courses()}};
async function chapters(){const s=await getDocs(collection(db,'courses'));let opts='';s.forEach(d=>opts+=`<option value="${esc(d.id)}">${esc(d.data().title||d.id)}</option>`);$('view').innerHTML=`<div class="card"><h2>Chapter जोड़ें</h2><select id="ccourse">${opts}</select><div class="row"><input id="chid" placeholder="Chapter ID"><input id="chtitle" placeholder="Chapter title"><input id="chorder" type="number" placeholder="Order"></div><button onclick="window.saveChapter()">Save Chapter</button><p class="muted">Structure: courses/{courseId}/chapters/{chapterId}</p></div>`}window.saveChapter=async()=>{let c=$('ccourse').value,id=$('chid').value.trim();if(!c||!id)return alert('Course और Chapter ID जरूरी है');await setDoc(doc(db,'courses',c,'chapters',id),{id,title:$('chtitle').value.trim(),order:Number($('chorder').value||0)},{merge:true});alert('Chapter save हो गया')};
async function lessons(){const s=await getDocs(collection(db,'courses'));let opts='';s.forEach(d=>opts+=`<option value="${esc(d.id)}">${esc(d.data().title||d.id)}</option>`);$('view').innerHTML=`<div class="card"><h2>Lesson जोड़ें</h2><select id="lcourse">${opts}</select><input id="lchapter" placeholder="Chapter ID"><div class="row"><input id="lid" placeholder="Lesson ID"><input id="ltitle" placeholder="Lesson title"><input id="lvideo" placeholder="Video URL"><input id="lnotes" placeholder="PDF/Notes URL"><input id="lorder" type="number" placeholder="Order"></div><button onclick="window.saveLesson()">Save Lesson</button><p class="muted">Structure: courses/{courseId}/chapters/{chapterId}/lessons/{lessonId}</p></div>`}window.saveLesson=async()=>{let c=$('lcourse').value,ch=$('lchapter').value.trim(),id=$('lid').value.trim();if(!c||!ch||!id)return alert('Course, Chapter और Lesson ID जरूरी हैं');await setDoc(doc(db,'courses',c,'chapters',ch,'lessons',id),{id,title:$('ltitle').value.trim(),description:'',videoUrl:$('lvideo').value.trim(),notesUrl:$('lnotes').value.trim(),order:Number($('lorder').value||0)},{merge:true});alert('Lesson save हो गया')};
async function quiz(){const s=await getDocs(collection(db,'courses'));let opts='';s.forEach(d=>opts+=`<option value="${esc(d.id)}">${esc(d.data().title||d.id)}</option>`);$('view').innerHTML=`<div class="card"><h2>Quiz Question जोड़ें</h2><select id="qcourse">${opts}</select><input id="qchapter" placeholder="Chapter ID"><input id="qlesson" placeholder="Lesson ID"><input id="qid" placeholder="Question ID"><textarea id="qtext" placeholder="Question"></textarea><input id="qopts" placeholder="Options — comma से अलग करें"><input id="qans" type="number" min="0" placeholder="Correct option index (0,1,2...)" value="0"><input id="qorder" type="number" placeholder="Order"><button onclick="window.saveQ()">Save Question</button></div>`}window.saveQ=async()=>{let c=$('qcourse').value,ch=$('qchapter').value.trim(),l=$('qlesson').value.trim(),id=$('qid').value.trim();if(!c||!ch||!l||!id)return alert('सभी IDs जरूरी हैं');await setDoc(doc(db,'courses',c,'chapters',ch,'lessons',l,'questions',id),{id,question:$('qtext').value.trim(),options:$('qopts').value.split(',').map(x=>x.trim()).filter(Boolean),answerIndex:Number($('qans').value||0),order:Number($('qorder').value||0)},{merge:true});alert('Question save हो गया')};
async function notices(){let s=await getDocs(collection(db,'announcements'));let rows='';s.forEach(d=>{let x=d.data();rows+=`<tr><td>${esc(x.title)}</td><td>${esc(x.message||x.text)}</td><td>${x.published?'Published':'Draft'}</td><td><button class="danger" onclick="window.delNotice('${d.id}')">Delete</button></td></tr>`});$('view').innerHTML=`<div class="card"><h2>Notice / Announcement</h2><input id="ntitle" placeholder="Title"><textarea id="ntext" placeholder="Message"></textarea><label><input id="npub" type="checkbox" checked> Published</label><br><button class="ok" onclick="window.saveNotice()">Publish Notice</button></div><div class="card"><table><tr><th>Title</th><th>Message</th><th>Status</th><th></th></tr>${rows}</table></div>`}window.saveNotice=async()=>{await addDoc(collection(db,'announcements'),{title:$('ntitle').value.trim(),message:$('ntext').value.trim(),published:$('npub').checked});alert('Notice publish हो गया');notices()};window.delNotice=async id=>{if(confirm('Notice delete करें?')){await deleteDoc(doc(db,'announcements',id));notices()}};
init();
</script></body></html>
