name: Build SmartStudents APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SmartStudents project
        run: |
          mkdir project
          unzip -q SmartStudents_V66_APK_READY.zip -d project

      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' project/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' project/gradle.properties
          else
            echo 'android.useAndroidX=true' >> project/gradle.properties
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudents-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
