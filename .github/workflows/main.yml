name: Build SmartStudents APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SmartStudents project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q SmartStudents_V66_APK_READY.zip -d project

      - name: Configure AndroidX and Gradle memory
        run: |
          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          EOF

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          text = p.read_text()

          # Add Kotlin JVM target import
          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n" + text

          # Set Java 17 target
          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "        targetSdk = 35\n"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: targetSdk = 35 was not found in app/build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  marker +
                  "        compileOptions {\n"
                  "            sourceCompatibility = JavaVersion.VERSION_17\n"
                  "            targetCompatibility = JavaVersion.VERSION_17\n"
                  "        }\n",
                  1
              )

          # Set Kotlin JVM target to 17
          if "jvmTarget = JvmTarget.JVM_17" not in text:
              text += """

          kotlin {
              compilerOptions {
                  jvmTarget = JvmTarget.JVM_17
              }
          }
          """

          p.write_text(text)

          print("Java/Kotlin JVM target fix applied successfully.")
          PY

      - name: Show final Gradle configuration
        run: |
          echo "===== app/build.gradle.kts ====="
          cat project/app/build.gradle.kts
          echo "===== gradle.properties ====="
          cat project/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudents-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
