name: Build SmartStudents APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SmartStudents project
        run: |
          mkdir project
          unzip -q SmartStudents_V66_APK_READY.zip -d project

      - name: Enable AndroidX
        run: |
          if grep -q '^android.useAndroidX=' project/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' project/gradle.properties
          else
            echo 'android.useAndroidX=true' >> project/gradle.properties
          fi

      - name: Configure Gradle JVM
        run: |
          if grep -q '^org.gradle.jvmargs=' project/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' project/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> project/gradle.properties
          fi

      - name: Create JVM compatibility fix
        run: |
          cat > jvm-fix.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon --init-script ../jvm-fix.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudents-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
